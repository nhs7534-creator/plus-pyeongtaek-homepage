<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사회적협동조합 플러스평택 관리자</title><link rel="stylesheet" href="assets/admin.css"><script defer src="assets/supabase-config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="assets/admin.js"></script></head><body><main class="admin-shell"><header><img src="assets/images/logo-symbol.png" alt=""><div><h1>사회적협동조합 플러스평택 관리자</h1><p>공지사항과 사진을 직접 등록합니다.</p></div></header><section id="setupNotice" class="panel warning" hidden><h2>Supabase 연결이 필요합니다</h2><p>아직 관리자 데이터베이스가 연결되지 않았습니다. <code>docs/관리자_설정가이드.md</code> 순서대로 한 번만 설정하면 됩니다.</p></section><section id="loginPanel" class="panel"><h2>관리자 로그인</h2><label>이메일<input id="loginEmail" type="email" autocomplete="username" placeholder="관리자 이메일"></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password"></label><button id="loginBtn">로그인</button><p id="loginMsg"></p></section><section id="dashboard" hidden><div class="topbar"><strong id="adminEmail"></strong><button id="logoutBtn" class="ghost">로그아웃</button></div><div class="tabs"><button class="tab active" data-tab="settings">기관정보</button><button class="tab" data-tab="posts">공지사항</button><button class="tab" data-tab="gallery">갤러리</button></div><section id="settingsTab" class="panel tabpane"><h2>기관정보</h2><p class="hint">팩스번호가 없으면 비워두세요. 홈페이지에서는 자동으로 숨겨집니다.</p><label>팩스번호<input id="siteFax" type="text" inputmode="tel" placeholder="예: 031-000-0000"></label><button id="saveSettingsBtn">기관정보 저장</button></section><section id="postsTab" class="panel tabpane" hidden><h2>공지사항 등록</h2><div class="grid2"><label>제목<input id="postTitle"></label><label>분류<select id="postCategory"><option>공지</option><option>조합소식</option><option>채용</option><option>입찰·공고</option></select></label></div><label>내용<textarea id="postBody" rows="7"></textarea></label><div class="grid2"><label>게시일<input id="postDate" type="date"></label><label class="check"><input id="postPinned" type="checkbox"> 중요 공지로 상단 고정</label></div><button id="savePostBtn">공지 등록</button><div id="postList" class="manage-list"></div></section><section id="galleryTab" class="panel tabpane" hidden><h2>사진 여러 장 등록</h2><p class="hint">JPG·PNG 이미지를 여러 장 선택하면 사진별 제목과 설명 입력칸이 나타납니다.</p><input id="galleryFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="pendingGallery" class="pending-grid"></div><button id="uploadGalleryBtn">선택한 사진 모두 등록</button><div id="galleryList" class="manage-list"></div></section><p id="globalMsg" class="msg"></p></section></main></body></html>
